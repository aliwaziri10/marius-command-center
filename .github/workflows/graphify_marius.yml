name: Graphify Marius

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"

permissions:
  contents: write

concurrency:
  group: graphify-marius
  cancel-in-progress: false

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install graphify (pinned)
        run: pip install graphifyy==0.9.79

      - name: Build code graph (free, no AI key)
        run: graphify update .

      - name: Show top connected parts
        run: graphify god-nodes --top 15

      - name: Save graph files
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/
          if-no-files-found: error

      - name: Commit graph and report
        run: |
          git config user.name "graphify-bot"
          git config user.email "graphify-bot@users.noreply.github.com"
          git add graphify-out/GRAPH_REPORT.md graphify-out/graph.json
          if git diff --cached --quiet; then
            echo "No graph changes"
          else
            git commit -m "Update graphify code map"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
