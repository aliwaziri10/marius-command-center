name: Code Health Check
on:
  push:
    paths:
      - "scripts/**.py"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every script (catches syntax/indentation errors before production runs them)
        run: |
          FAILED=0
          for f in scripts/*.py; do
            if ! python -m py_compile "$f"; then
              echo "COMPILE FAILED: $f"
              FAILED=1
            fi
          done
          exit $FAILED
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Code Health Check failed - a script has a syntax/indentation error (run #${{ github.run_number }})" \
            --body "A push to scripts/ introduced a Python syntax or indentation error - this would have silently broken production on the next scheduled cron run instead of being caught here.
          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
