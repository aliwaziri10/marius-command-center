name: Kaggle Video Test

on:
  workflow_dispatch:

jobs:
  kaggle-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'Diawazi' }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle tool
        run: pip install kaggle

      - name: Run Kaggle video test
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY
          [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          python scripts/kaggle_video_test/run_test.py

      - name: Save test clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-test-output
          path: kaggle_out/
          if-no-files-found: ignore
